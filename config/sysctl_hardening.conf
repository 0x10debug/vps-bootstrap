# sysctl_hardening.conf — CIS Benchmark v14.0 Level 1 kernel hardening
#
# Complete sysctl hardening configuration aligned with CIS Benchmark v14.0
# Level 1 recommendations for Linux. Drop-in for /etc/sysctl.d/.
#
# Apply with:
#   sysctl -p config/sysctl_hardening.conf
# or copy to /etc/sysctl.d/99-mb-cis-hardening.conf and run `sysctl --system`.
#
# Project: https://github.com/0x10debug/vps-bootstrap
#
# NOTE: Some parameters (e.g. max_user_namespaces) may break container
# runtimes. mb's kernel module tunes a performance-oriented subset; this
# file is the full CIS L1 baseline for auditing and manual hardening.

# ── 1. Network: IP forwarding ─────────────────────────────────────────────────
# CIS 3.1.1 / 3.1.2 — disable IP forwarding unless the host is a router.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# ── 2. Network: redirect acceptance ──────────────────────────────────────────
# CIS 3.1.3 / 3.1.4 / 3.1.5 / 3.1.6 — reject ICMP redirects (spoofing risk).
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# ── 3. Network: source routing ───────────────────────────────────────────────
# CIS 3.1.7 / 3.1.8 / 3.1.9 / 3.1.10 — reject source-routed packets.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# ── 4. Network: martian / bogus packet logging ───────────────────────────────
# CIS 3.1.11 / 3.1.12 — log spoofed and malformed packets.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ── 5. Network: reverse path filtering ───────────────────────────────────────
# CIS 3.1.13 / 3.1.14 — strict reverse path filtering (anti-spoofing).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# ── 6. Network: broadcast ICMP / echo requests ───────────────────────────────
# CIS 3.1.15 / 3.1.16 / 3.1.17 / 3.1.18 — ignore broadcast ICMP, rate-limit echo.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.tcp_syncookies = 1

# ── 7. Network: TCP timestamps ───────────────────────────────────────────────
# CIS 3.1.19 — disable TCP timestamps (reduces fingerprinting).
net.ipv4.tcp_timestamps = 0

# ── 8. Kernel: ASLR and core dumps ───────────────────────────────────────────
# CIS 1.1.5 / 1.1.6 — enable ASLR, disable SUID core dumps.
kernel.randomize_va_space = 2
fs.suid_dumpable = 0

# ── 9. Kernel: information disclosure restrictions ───────────────────────────
# CIS 1.1.7 / 1.1.8 / 1.1.9 / 1.1.10 — restrict kernel pointer / dmesg /
# perf event / ptrace exposure.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.perf_event_paranoid = 2
kernel.yama.ptrace_scope = 1

# ── 10. Kernel: user namespaces ──────────────────────────────────────────────
# CIS 1.1.11 — disable unprivileged user namespaces.
# WARNING: setting to 0 breaks Docker/rootless containers. mb leaves this
# commented by default; uncomment only on non-container hosts.
# user.max_user_namespaces = 0

# ── 11. File system: link protection ─────────────────────────────────────────
# CIS 1.1.12 / 1.1.13 — restrict hardlinks / symlinks to owned files.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

# ── 12. Performance tuning (mb additions, not strictly CIS) ──────────────────
# These are mb's performance defaults, kept here so the hardening file is a
# complete drop-in replacement for mb's kernel module output.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
fs.file-max = 1048576
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 1048576
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535
net.ipv4.tcp_max_syn_backlog = 65535
net.ipv4.tcp_max_tw_buckets = 1048576
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.ip_local_port_range = 1024 65535
